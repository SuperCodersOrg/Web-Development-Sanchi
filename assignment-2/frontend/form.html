<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registeration form</title>
    <style>
        #register{
            margin: 20px;
            padding: 30px;
            background-color: white;
        }

        #register h3{
            text-align: center;
            font-weight: 400;
            color: rgb(90,90,90);
        }

        #register form{
            margin-top: 25px;
        }

        #register label{
            display: block;
            margin-top: 15px;
            color: rgb(2,48,80);
        }

        #register button{
            margin-top: 20px;
            padding: 10px 20px;
            border: none;
            background-color: rgb(42,157,143);
            color: white;
        }

        #register input,
        #register select{
            width: 100%;
            box-sizing: border-box;
           padding: 10px;
            margin-top: 5px;
            border: 1px solid rgb(210,210,210);
            background-color: rgb(248,249,252);
        }

        #register h3:nth-child(2){
            font-size: 16px;
            color: rgb(90,90,90);
        }
    </style>
</head>
<body>
    <section id="register">
        <h3>Registeration Open</h3>
        <h3>Students can register for admission by providing their basic academic and personal information.</h3>
        <form method="POST" action="#" id="form">
            <label for="name">Student's Name</label>
            <input type="text" id="name" name="name" placeholder="Enter your name"/>

            <label for="email">Email-address</label>
            <input type="email" id="email" name="email" placeholder="Enter your e-mail"/>

            <label for="number">Contact</label>
            <input type="number" id="number" name="number" placeholder="Enter your ph.number"/>

            <label for="date">Date Of Birth</label>
            <input type="date" id="date" name="date" placeholder="Enter your d-o-b"/>

            <label for="course">Course</label>
            <input type="text" id="course" name="course" placeholder="Enter your course"/>

            <label for="batch">Batch No.</label>
            <input type="number" id="batch" name="batch" placeholder="Enter your batch"/>

            <label for="gender">Gender</label>
            <select id="gender">
                <option value="Male">Male</option>
                <option value="Female">Female</option>
            </select>

            <label for="address">Address</label>
            <input type="text" id="address" name="address" placeholder="Enter your address"/>

            <button id="submit">Register your details</button>
        </form>
    </section>

    <script src="./form.js"></script>
</body>
</html>
